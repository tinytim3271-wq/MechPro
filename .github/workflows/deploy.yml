name: Deploy MechPro to AWS

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 001018341557

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install CDK dependencies
        working-directory: ./MechPro-AWS
        run: npm install

      - name: Install React dependencies
        working-directory: ./MechPro/MechPro
        run: npm install

      - name: Build CDK
        working-directory: ./MechPro-AWS
        run: npm run build

      - name: Build React
        working-directory: ./MechPro/MechPro
        run: npm run build

      - name: Run tests (if available)
        working-directory: ./MechPro-AWS
        run: npm test || true

  deploy-backend:
    name: Deploy Backend Infrastructure
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK dependencies
        working-directory: ./MechPro-AWS
        run: npm install

      - name: Bootstrap CDK (first time only)
        working-directory: ./MechPro-AWS
        run: |
          npx cdk bootstrap aws://${{ env.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }} || true

      - name: Deploy CDK Stack
        working-directory: ./MechPro-AWS
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npx cdk deploy --require-approval=never

      - name: Store Stack Outputs
        working-directory: ./MechPro-AWS
        run: |
          aws cloudformation describe-stacks --stack-name MechProAwsStack --region ${{ env.AWS_REGION }} > stack-outputs.json
          echo "::set-output name=stack-outputs::$(cat stack-outputs.json)"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [test, deploy-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install React dependencies
        working-directory: ./MechPro/MechPro
        run: npm install

      - name: Get Stack Outputs
        id: stack
        run: |
          aws cloudformation describe-stacks --stack-name MechProAwsStack --region ${{ env.AWS_REGION }} --query 'Stacks[0].Outputs[?OutputKey==`APIGatewayURL`].OutputValue' --output text

      - name: Build React App
        working-directory: ./MechPro/MechPro
        env:
          REACT_APP_API_GATEWAY_URL: ${{ steps.stack.outputs.result }}
        run: npm run build

      - name: Deploy to S3
        working-directory: ./MechPro/MechPro
        run: |
          BUCKET_NAME=$(aws s3api list-buckets --query "Buckets[?contains(Name, 'mechpro-frontend')].Name" --output text)
          aws s3 sync ./dist s3://$BUCKET_NAME/ --delete

      - name: Invalidate CloudFront Cache
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(DomainName, 'mechpro')].Id" --output text)
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"

      - name: Deployment Summary
        run: |
          echo "✅ MechPro deployed successfully!"
          echo "Frontend: $(aws cloudfront list-distributions --query \"DistributionList.Items[?contains(DomainName, 'mechpro')].DomainName\" --output text)"
