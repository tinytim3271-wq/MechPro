name: Deploy MechPro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  VITE_USE_AWS: true
  VITE_HERCULES_OIDC_AUTHORITY: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_krZ9Pk8xK
  VITE_HERCULES_OIDC_CLIENT_ID: 472ec923s0k9er6v0maglag5am
  VITE_CONVEX_URL: https://y790h8osxf.execute-api.us-east-1.amazonaws.com

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devpw
          POSTGRES_DB: mechpro
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Install AWS backend deps
        working-directory: aws
        run: npm ci

      - name: Apply test schema
        working-directory: aws
        env:
          TEST_DATABASE_URL: postgres://postgres:devpw@localhost:55433/mechpro
        run: |
          npm run db:schema || PGPASSWORD=devpw psql -h localhost -p 55433 -U postgres -d mechpro -f db/schema.sql

      - name: Build AWS backend
        working-directory: aws
        run: npm run build

      - name: Test AWS runtime
        working-directory: aws
        env:
          TEST_DATABASE_URL: postgres://postgres:devpw@localhost:55433/mechpro
        run: npm test

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install and build
        run: |
          npm ci --legacy-peer-deps
          npm run build
          cd aws && npm ci && npm run build

      - name: Deploy CDK stack
        working-directory: aws
        run: npm run cdk:deploy -- -c deploySpa=false -c frontendUrl=${{ vars.FRONTEND_URL || 'https://yourcarguy806.com' }}

      - name: Deploy frontend to S3 static site
        env:
          STATIC_SITE_BUCKET: mechprostaticsitestack-mechprositebucket45bd4c2e-9sirc627wf04
        run: aws s3 sync dist s3://$STATIC_SITE_BUCKET/ --delete
