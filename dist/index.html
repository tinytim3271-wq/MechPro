  <!-- Web Awesome uses class-based color schemes. Track the OS preference. -->
  <script>
    (() => {
      const root = document.documentElement;
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const applyScheme = (isDark) => {
        root.classList.toggle('wa-dark', isDark);
        root.classList.toggle('wa-light', !isDark);
      };
      applyScheme(media.matches);
      media.addEventListener('change', (event) => applyScheme(event.matches));
    })();
  </script>
